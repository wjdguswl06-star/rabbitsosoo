<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토끼와 소수 대모험 | 4학년 소수의 덧셈과 뺄셈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6CC; --y1:#FFE066; --y2:#FFD43B; --y3:#F2B500; --cream:#FFFBEA;
  --ink:#4A3424; --soft:#86684F; --line:#EBD9A6;
  --pink:#FF8FAB; --pink2:#FFE0E8; --carrot:#FF8A3D; --leaf:#4FAE62; --sky:#CBEAF7;
  --ok:#2B8A3E; --okbg:#E6F7EA; --bad:#D9363E; --badbg:#FFECEC; --violet:#7B4FD8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);font-size:17px;line-height:1.65;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.75) 3px,transparent 3.5px),radial-gradient(circle at 36px 36px,rgba(242,181,0,.18) 3px,transparent 3.5px);
  background-size:48px 48px}
h1,h2,h3,h4,button,.jua,.prompt b,.score,.lvl,.count,.qno,select.bl,input.bl,.big-in{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
h2{font-size:1.55rem;margin:0 0 6px;line-height:1.3} h3{font-size:1.25rem;margin:22px 0 10px;line-height:1.35} p{margin:0 0 8px}
button{cursor:pointer;color:var(--ink)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;max-width:980px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{margin:0;font-size:1.6rem;line-height:1.1}
.logo small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:.85rem;color:var(--soft)}
.logo svg{width:52px;height:52px}
.who{font-size:.95rem;color:var(--soft);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who b{color:var(--ink)}
.link{background:none;border:0;font:inherit;font-family:'Gowun Dodum',sans-serif;color:var(--violet);text-decoration:underline;padding:4px 6px}
.card{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px 20px;box-shadow:0 6px 0 var(--ink)}
.btn{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:10px 22px;font-size:1.1rem;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--y2)}
.btn.pink{background:var(--pink)}
.btn.violet{background:var(--violet);color:#fff}
.btn.small{font-size:.95rem;padding:6px 14px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;align-items:center}
.muted{color:var(--soft);font-size:.92rem}
.warn{color:var(--bad);min-height:1.5em;margin-top:8px;font-size:.95rem}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 로그인 */
.login{max-width:440px;margin:40px auto}
.login .row{display:grid;grid-template-columns:4em 1fr;gap:10px;align-items:center;margin:8px 0}
.login input,.login select{font:inherit;font-family:'Jua',sans-serif;font-size:1.2rem;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;width:100%;background:var(--cream);color:var(--ink)}
.login .bunny{display:block;width:150px;margin:-80px auto 0}

/* 홈 */
.herocard{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:18px;align-items:center;background:linear-gradient(180deg,#fff 0,#fff 62%,var(--cream) 62%)}
.stage{position:relative;background:radial-gradient(circle at 50% 70%,var(--y1) 0 55%,transparent 56%);border-radius:20px}
.stage svg.hero{width:100%;height:auto;display:block}
.lvl{display:inline-block;background:var(--ink);color:var(--y1);border-radius:12px;padding:2px 12px;font-size:1.1rem}
.xpbar{height:20px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:8px 0 4px}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--y2) 0 10px,var(--y1) 10px 20px);transition:width .8s}
.slots{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;border:3px dashed var(--line);border-radius:16px;padding:6px 4px;background:#fff;font-size:.8rem;color:var(--soft)}
.slot .e{font-size:2rem;line-height:1.1;min-height:2.2rem}
.slot.on{border-style:solid;border-color:var(--ink)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lcard{position:relative;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 16px 12px;box-shadow:0 5px 0 var(--ink);font-family:'Gowun Dodum',sans-serif;font-size:1rem;min-height:150px}
.lcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.lcard .no{font-family:'Jua',sans-serif;background:var(--y2);border:2px solid var(--ink);border-radius:10px;padding:0 8px;font-size:.95rem}
.lcard .t{display:block;font-family:'Jua',sans-serif;font-size:1.25rem;margin:8px 0 4px}
.lcard .sc{font-size:.88rem;color:var(--soft)}
.lcard .its{margin-top:6px;font-size:1.4rem;letter-spacing:4px}
.lcard .its .lock{filter:grayscale(1);opacity:.35}
.stamp{position:absolute;right:10px;top:10px;transform:rotate(12deg);border:3px solid var(--bad);color:var(--bad);border-radius:12px;padding:0 8px;font-family:'Jua',sans-serif;font-size:1rem;background:#fff}
.bosscard{display:flex;gap:16px;align-items:center;margin-top:16px;background:linear-gradient(135deg,#3B2A4F,#6B4FA0);color:#fff;border:3px solid var(--ink);border-radius:24px;padding:16px 20px;box-shadow:0 6px 0 var(--ink)}
.bosscard svg{width:110px;height:auto;flex:none}
.bosscard h3{margin:0 0 4px;color:var(--y1)}
.bosscard.locked{background:#9C93AC}
.bosscard.locked svg{filter:grayscale(1) brightness(.6)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;text-align:center;font-family:'Gowun Dodum',sans-serif;font-size:.85rem}
.item .e{display:block;font-size:2.1rem;line-height:1.3}
.item.lock{border-style:dashed;border-color:var(--line);color:var(--soft)}
.item.lock .e{filter:grayscale(1);opacity:.3}
.item.eq{background:var(--y1)}
.item .kind{display:block;font-size:.75rem;color:var(--soft)}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(74,52,36,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:22px;max-width:520px;width:100%;box-shadow:0 8px 0 var(--y3);max-height:92vh;overflow:auto}
.lvbtns{display:grid;gap:12px;margin-top:12px}
.lvbtn{display:block;text-align:left;border:3px solid var(--ink);border-radius:18px;padding:12px 16px;background:var(--cream);box-shadow:0 4px 0 var(--ink);font-family:'Gowun Dodum',sans-serif;font-size:.95rem}
.lvbtn b{font-family:'Jua',sans-serif;font-weight:400;font-size:1.3rem;display:block}
.lvbtn.adv{background:var(--pink2)}

/* 달리기 띠 */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qtitle{font-family:'Jua',sans-serif;font-size:1.1rem}
.badge{display:inline-block;border:2px solid var(--ink);border-radius:10px;padding:0 8px;font-size:.85rem;background:var(--y1);margin-left:4px}
.badge.adv{background:var(--pink)}
.track{position:relative;height:96px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:16px;
  background:linear-gradient(180deg,var(--sky) 0 52%,#9AD97A 52% 100%)}
.track::after{content:"";position:absolute;left:24px;right:70px;top:66%;border-top:3px dashed rgba(255,255,255,.85)}
.dots{position:absolute;left:44px;right:84px;top:66%;display:flex;justify-content:space-between;transform:translateY(-50%);z-index:1}
.dots i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.dots i.ok{background:var(--y2)} .dots i.no{background:var(--soft)} .dots i.now{background:var(--pink);transform:scale(1.35)}
.runner{position:absolute;bottom:12px;left:calc(16px + (100% - 120px) * var(--p));width:62px;transition:left .6s cubic-bezier(.3,1.4,.5,1);z-index:2}
.runner svg{width:100%;height:auto;display:block;animation:hop .55s ease-in-out infinite;transform-origin:50% 100%}
.runner::before{content:"";position:absolute;left:-18px;bottom:6px;width:16px;height:6px;border-top:3px solid rgba(255,255,255,.9);border-bottom:3px solid rgba(255,255,255,.9);border-radius:4px}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.goal{position:absolute;right:20px;bottom:16px;font-size:2.2rem;z-index:2}
.count{position:absolute;right:14px;top:6px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 10px;font-size:1.15rem;z-index:3}
.sun{position:absolute;left:14px;top:6px;font-family:'Jua',sans-serif;font-size:.95rem;background:rgba(255,255,255,.8);border-radius:10px;padding:0 8px;z-index:3}

/* 문제 카드 */
.qcard{padding:20px 22px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qno{font-size:1.35rem}
.stage-tag{font-size:.82rem;border-radius:10px;padding:1px 10px;border:2px solid var(--ink);background:var(--cream)}
.stage-tag.s3{background:var(--sky)} .stage-tag.s4{background:var(--pink)}
.pts{margin-left:auto;font-family:'Jua',sans-serif;background:var(--y1);border-radius:10px;padding:0 10px}
.prompt{font-size:1.22rem;line-height:1.55;margin:4px 0 10px}
.prompt b{font-size:1.1em}
.hintbox{background:var(--cream);border:3px dashed var(--y3);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.hintbox b{font-family:'Jua',sans-serif;font-weight:400}
.cond{margin:6px 0;padding-left:1.3em} .cond li{margin:2px 0}
.ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big-in{font-size:1.5rem;padding:8px 14px;border:3px solid var(--ink);border-radius:14px;width:8em;background:var(--cream);color:var(--ink)}
.unit{font-family:'Jua',sans-serif;font-size:1.4rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.chc{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:12px;font-size:1.2rem;min-height:56px}
.chc.sel{background:var(--y1);box-shadow:inset 0 -4px 0 var(--y3)}
.chc.right{background:var(--okbg);border-color:var(--ok)}
.blank-text{font-size:1.18rem;line-height:2.3;margin:0}
input.bl,select.bl{font-size:1.15rem;width:4.6em;padding:2px 6px;border:none;border-bottom:3px solid var(--ink);background:var(--cream);text-align:center;color:var(--ink);border-radius:6px 6px 0 0;margin:0 3px}
select.bl{width:auto}
.cmpq{display:flex;align-items:center;justify-content:center;gap:16px;font-family:'Jua',sans-serif;font-size:1.9rem;margin:8px 0;flex-wrap:wrap}
.cmpq .circ{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border:3px solid var(--ink);border-radius:50%;font-size:1.1rem;color:transparent}
.dcards{display:flex;gap:10px;margin:8px 0}
.dcards span{display:grid;place-items:center;width:52px;height:68px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-family:'Jua',sans-serif;font-size:1.9rem;box-shadow:0 4px 0 var(--y3)}
.tagged{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:1.1rem;margin:8px 0}
.tagged span{background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:2px 12px}

/* 모눈 */
.grids{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.g100{display:grid;grid-template-columns:repeat(10,1fr);width:min(250px,72vw);aspect-ratio:1;border:3px solid var(--ink);background:#fff;user-select:none;touch-action:none}
.g100 span{border:1px solid #E3D3A3}
.g100 span.f1,.g100 span.on{background:var(--carrot);border-color:#D9691F}
.g100 span.f2{background:#5CA8F0;border-color:#3C86CC}
.g100 span.x{background-image:linear-gradient(45deg,transparent 44%,var(--ink) 45% 55%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--ink) 45% 55%,transparent 56%)}
.g100.pt span{cursor:pointer}
.legend{font-size:.9rem;color:var(--soft)}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:middle;border:1px solid var(--ink);margin:0 4px}

/* 수직선 */
.nlwrap{overflow-x:auto}
svg.nl{width:100%;max-width:680px;height:auto;display:block}
svg.nl .hit{cursor:pointer}
svg.nl .hit:hover{fill:rgba(255,143,171,.18)}

/* 세로셈 */
table.vt{border-collapse:collapse;margin:8px 0;font-family:'Jua',sans-serif;font-size:1.6rem}
.vt td{width:52px;height:52px;text-align:center;padding:2px;border-left:2px dashed #D9BE74}
.vt td:first-child{border-left:0;width:40px}
.vt td.pt{width:18px;border-left:0;font-size:1.7rem}
.vt td.pt + td{border-left:0}
.vt tr.memo td{height:34px}
.vt tr.memo td.lab{font-family:'Gowun Dodum',sans-serif;font-size:.7rem;color:var(--soft);width:auto;white-space:nowrap}
.vt tr.res td{border-top:4px solid var(--ink)}
.vt tr.res td:first-child{border-top:4px solid var(--ink)}
.vt input{width:44px;height:46px;font:inherit;text-align:center;border:3px solid var(--ink);border-radius:10px;background:var(--cream);color:var(--ink);padding:0}
.vt input.mi{width:36px;height:30px;font-size:1rem;border-width:2px;border-color:var(--pink);color:var(--bad);background:#fff}
.vt .ghost{color:#C9B583}
.vexp table.vert{border-collapse:collapse;font-family:'Jua',sans-serif;font-size:1.5rem;margin:6px 0}
.vexp .vert td{width:1.3em;text-align:center}
.vexp .vert td.pt{width:.45em}
.vexp .vert tr.mark td{font-size:.85rem;color:var(--bad)}
.vexp .vert tr.res td{border-top:3px solid var(--ink);color:var(--violet)}
ol.steps{margin:4px 0;padding-left:1.4em;font-size:.95rem}

/* 순서 */
.ord-pool{display:flex;flex-wrap:wrap;gap:10px}
.ord-pool .chc{min-width:90px}
.ord-pool .chc:disabled{opacity:.3}
.ord-seq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:56px;margin:12px 0;padding:8px 12px;border:3px dashed var(--line);border-radius:16px;font-family:'Jua',sans-serif;font-size:1.3rem}
.ord-seq .sym{color:var(--soft)}

/* 피드백 */
.fb{display:none;margin-top:14px;border-radius:18px;padding:12px 16px}
.fb.show{display:block}
.fb.ok{background:var(--okbg);border:3px solid var(--ok)}
.fb.bad{background:var(--badbg);border:3px solid var(--bad)}
.fb h4{margin:0 0 4px;font-size:1.35rem}
.fb.ok h4{color:var(--ok)} .fb.bad h4{color:var(--bad)}
.exp{background:#fff;border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.98rem}

/* 결과 */
.result{text-align:center}
.score{font-size:4.2rem;line-height:1;margin:6px 0}
.score small{font-size:1.4rem;color:var(--soft)}
.xpgain{display:inline-block;font-family:'Jua',sans-serif;font-size:1.6rem;background:var(--y1);border:3px solid var(--ink);border-radius:16px;padding:4px 18px;margin:8px 0;animation:pop .5s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.callout{background:var(--pink2);border:3px solid var(--pink);border-radius:18px;padding:10px 14px;margin:14px 0 4px;text-align:left}
.bands{margin:10px auto;border-collapse:collapse;font-size:.85rem}
.bands td,.bands th{border:2px solid var(--line);padding:2px 8px}
.bands th{background:var(--cream);font-weight:400}
.newitems{font-size:2.4rem;letter-spacing:8px}
.send{font-size:.85rem;color:var(--soft);margin-top:10px}
.mini-hero{width:150px;margin:0 auto;display:block}

/* 보스 */
.arena{position:relative;height:340px;border:3px solid var(--ink);border-radius:26px;overflow:hidden;margin-bottom:14px;
  background:linear-gradient(180deg,#3B2A4F 0,#6B4FA0 55%,#8C6A3E 55%,#6E5230 100%)}
.arena::before{content:"✦  ✧   ✦     ✧  ✦      ✧    ✦";position:absolute;left:0;right:0;top:12px;color:rgba(255,255,255,.5);letter-spacing:6px;text-align:center}
.fighter{position:absolute;bottom:18px;transition:transform .2s}
.fighter.me{left:4%;width:30%;max-width:190px}
.fighter.boss{right:3%;width:42%;max-width:225px}
.fighter svg{width:100%;height:auto;display:block}
.fighter.me.atk{animation:lunge .6s}
.fighter.me.down{transform:rotate(-80deg) translateX(-20px);transform-origin:50% 100%}
.fighter.boss.hit{animation:hit .5s}
.fighter.boss.atk{animation:slam .7s}
@keyframes lunge{40%{transform:translateX(120%) rotate(8deg)}100%{transform:none}}
@keyframes hit{20%{transform:translateX(14px);filter:brightness(2)}40%{transform:translateX(-10px)}60%{transform:translateX(8px);filter:brightness(1.6)}}
@keyframes slam{40%{transform:translateX(-35%) rotate(-10deg)}100%{transform:none}}
.hpbox{position:absolute;right:14px;top:34px;left:46%;color:#fff;font-family:'Jua',sans-serif;z-index:3}
.hp{height:18px;border:3px solid #fff;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#FF5C5C,#FF9F43);transition:width .6s}
.mylabel{position:absolute;left:14px;top:34px;color:var(--y1);font-family:'Jua',sans-serif;z-index:3}
.dmg{position:absolute;right:22%;top:30%;font-family:'Jua',sans-serif;font-size:2.4rem;color:#FFE066;text-shadow:0 3px 0 #4A3424;animation:float 1s forwards;z-index:4;pointer-events:none}
@keyframes float{0%{opacity:0;transform:translateY(20px) scale(.6)}30%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-50px)}}
.bcount{font-family:'Jua',sans-serif;font-size:1.2rem;margin-bottom:8px}
.fail h2{color:var(--bad);font-size:3rem;text-align:center;margin:0}
.win h2{color:var(--y3);font-size:2.6rem;text-align:center;margin:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:640px){
  body{font-size:16px}
  .herocard{grid-template-columns:1fr;background:#fff}
  .stage{max-width:240px;margin:0 auto}
  .card{padding:14px}
  .vt td{width:42px;height:46px} .vt input{width:36px;height:40px}
  .arena{height:270px}
  .runner{width:48px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 보물상자 */
.chestcard{display:flex;gap:16px;align-items:center;width:100%;text-align:left;margin-top:16px;background:linear-gradient(135deg,#FFF3C4,#FFE066);border:3px solid var(--ink);border-radius:24px;padding:14px 20px;box-shadow:0 6px 0 var(--ink);font-family:'Gowun Dodum',sans-serif;font-size:1rem}
.chestcard:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.chestcard h3{margin:0 0 4px}
.chestimg{width:120px;flex:none}
.chestimg svg{width:100%;height:auto;display:block}
.chesthead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,#fff,var(--cream))}
.chesttabs{display:inline-flex;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px;margin:18px 0 10px}
.chesttabs button{border:0;background:none;padding:8px 18px;border-radius:999px;font-size:1.05rem}
.chesttabs button[aria-pressed="true"]{background:var(--ink);color:var(--y1)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 14px;font-size:.95rem}
.chips button[aria-pressed="true"]{background:var(--y2)}
.wlist{display:grid;gap:14px}
.witem{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px 18px;box-shadow:0 4px 0 var(--line)}
.witem.done{border-style:dashed;background:#FFFDF3}
.witem .meta{font-size:.88rem;color:var(--soft)}
.witem .meta .no{font-family:'Jua',sans-serif;background:var(--y2);border:2px solid var(--ink);border-radius:8px;padding:0 6px;color:var(--ink)}
.wprompt{font-size:1.1rem;margin:8px 0 6px;line-height:1.55}
.witem details summary{cursor:pointer;color:var(--violet);margin-bottom:6px}
.pill{display:inline-block;font-size:.8rem;border-radius:8px;padding:0 8px;margin-left:4px}
.pill.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
@media (max-width:640px){.chestimg{width:90px}.chestcard{padding:12px}}
.chesthead > div:last-child{flex:1;min-width:240px}
